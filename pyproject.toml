[project]
name = "ez-ha"
version = "0.1.0"
description = "Python UV Boilerplate contains all the boilerplate you need to create a Python repo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "homeassistant-api>=6.1.0",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.3",
    "prek>=0.5.9",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ty>=0.0.95",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.isort]
profile = "black"
src_paths = "tests"
line_length = 80
include_trailing_comma = true
multi_line_output = 3

[tool.ruff]
exclude = ["__pycache__", "terraform", ".git", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
